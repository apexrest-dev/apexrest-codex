<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">APEXREST mandatory agent workflow</title>
  <desc id="desc">The manager plans, one to three developers work sequentially, the manager reviews code, independent QA verifies it, and the manager reviews QA. Repairs repeat from development up to three total revisions. Completion requires both approvals, passed QA checks and unchanged source and input. Deployment authorization remains separate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="780" gradientUnits="userSpaceOnUse"><stop stop-color="#10263A"/><stop offset="1" stop-color="#071522"/></linearGradient>
    <marker id="next" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" stroke="#70CECD" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="repair" markerWidth="7" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" stroke="#E7BE7A" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:15px;letter-spacing:2px;font-weight:700;fill:#79DFD4}.title{font-size:40px;font-weight:700;fill:#F5FAFF}.sub{font-size:21px;fill:#B8C9D9}.step{font-size:20px;font-weight:700;fill:#F5FAFF}.role{font-size:15px;font-weight:700;fill:#9AEEE0}.body{font-size:16px;fill:#BDD0DE}.gate{font-size:22px;font-weight:700;fill:#F5FAFF}.detail{font-size:18px;fill:#BDD0DE}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="778" rx="24" fill="url(#bg)" stroke="#294153" stroke-width="2"/>
  <path d="M56 1H1144" stroke="#5DE4CC" stroke-width="3"/>
  <text class="eyebrow" x="48" y="54">APEXREST · CODEX</text>
  <text class="title" x="48" y="112">One task. Separate agents. Required reviews.</text>
  <text class="sub" x="48" y="156">Codex desktop + CLI · The runtime controls the sequence</text>
  <g>
    <rect x="48" y="204" width="208" height="214" rx="16" fill="#122D42" stroke="#355366"/>
    <text class="eyebrow" x="66" y="237">01</text>
    <text class="step" x="66" y="274">Planning</text>
    <text class="role" x="66" y="309">Mewtwo</text>
    <path d="M66 330H238" stroke="#355366"/>
    <text class="body" x="66" y="363">Assign bounded work</text>
    <text class="body" x="66" y="390">Define acceptance</text>
  </g>
  <path d="M260 310H268" stroke="#70CECD" stroke-width="2" marker-end="url(#next)"/>
  <g>
    <rect x="272" y="204" width="208" height="214" rx="16" fill="#122D42" stroke="#355366"/>
    <text class="eyebrow" x="290" y="237">02</text>
    <text class="step" x="290" y="274">Development</text>
    <text class="role" x="290" y="309">Pikachu + optional</text>
    <path d="M290 330H462" stroke="#355366"/>
    <text class="body" x="290" y="363">Charmander / Bulbasaur</text>
    <text class="body" x="290" y="390">Work in sequence</text>
  </g>
  <path d="M484 310H492" stroke="#70CECD" stroke-width="2" marker-end="url(#next)"/>
  <g>
    <rect x="496" y="204" width="208" height="214" rx="16" fill="#122D42" stroke="#355366"/>
    <text class="eyebrow" x="514" y="237">03</text>
    <text class="step" x="514" y="274">Code review</text>
    <text class="role" x="514" y="309">Mewtwo</text>
    <path d="M514 330H686" stroke="#355366"/>
    <text class="body" x="514" y="363">Inspect actual changes</text>
    <text class="body" x="514" y="390">Approve or revise</text>
  </g>
  <path d="M708 310H716" stroke="#70CECD" stroke-width="2" marker-end="url(#next)"/>
  <g>
    <rect x="720" y="204" width="208" height="214" rx="16" fill="#173741" stroke="#508B84"/>
    <text class="eyebrow" x="738" y="237">04</text>
    <text class="step" x="738" y="274">Independent QA</text>
    <text class="role" x="738" y="309">Squirtle</text>
    <path d="M738 330H910" stroke="#355366"/>
    <text class="body" x="738" y="363">Run relevant checks</text>
    <text class="body" x="738" y="390">Record own evidence</text>
  </g>
  <path d="M932 310H940" stroke="#70CECD" stroke-width="2" marker-end="url(#next)"/>
  <g>
    <rect x="944" y="204" width="208" height="214" rx="16" fill="#122D42" stroke="#355366"/>
    <text class="eyebrow" x="962" y="237">05</text>
    <text class="step" x="962" y="274">Final review</text>
    <text class="role" x="962" y="309">Mewtwo</text>
    <path d="M962 330H1134" stroke="#355366"/>
    <text class="body" x="962" y="363">Review QA and source</text>
    <text class="body" x="962" y="390">Approve or revise</text>
  </g>
  <path d="M1048 419V450H376V425" stroke="#E7BE7A" stroke-width="2" marker-end="url(#repair)"/>
  <path d="M824 419V450M600 419V450" stroke="#E7BE7A" stroke-width="2"/>
  <rect x="48" y="478" width="1104" height="94" rx="14" fill="#2D2D31" stroke="#766343"/>
  <text x="72" y="515" font-size="23" font-weight="700" fill="#E7BE7A">Revise or failed QA → return to development</text>
  <text class="detail" x="72" y="549">At most 3 revisions total. Every repair repeats both reviews and QA.</text>
  <rect x="48" y="596" width="1104" height="128" rx="16" fill="#12383B" stroke="#508B84"/>
  <text class="gate" x="72" y="631">Completion gate</text>
  <text class="detail" x="72" y="662">Both manager approvals + QA pass + every check passed</text>
  <text class="detail" x="72" y="692">The source digest and task input must still match.</text>
  <rect x="930" y="633" width="198" height="54" rx="12" fill="#A5E2C7"/>
  <text x="1029" y="667" text-anchor="middle" font-size="22" font-weight="700" fill="#15362D">COMPLETED</text>
  <text x="48" y="756" font-size="17" fill="#A8BFCE">Reviewed code → separate authorized APEX plan, backup, import and runtime verification</text>
</svg>
