<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" fill="none" lang="uk" xml:lang="uk" role="img" aria-labelledby="title desc">
  <title id="title">Процес контрольованого розгортання APEXREST</title>
  <desc id="desc">П’ять кроків: змінити код; скомпілювати й створити план із прив’язкою до хешу; перевірити ціль і розбіжності та зробити копію; виконати дозволений імпорт зафіксованого коду зі стійким журналом; перевірити результат відповідними перевірками та вбудованим браузером, якщо доступний. Локальна історія міграцій і координація однієї машини є типовими. Production потребує захищеного зовнішнього схвалення. Невідомий результат потребує звіряння перед повторенням.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#10263A"/><stop offset="1" stop-color="#071522"/></linearGradient>
    <linearGradient id="accent" x1="54" y1="0" x2="1146" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5DE4CC"/><stop offset="1" stop-color="#81B7FF"/></linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0 1L5 4L0 7" stroke="#70CECD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#79DFD4}.heading{font-size:42px;font-weight:700;fill:#F5FAFF}.body{font-size:18px;fill:#B8C9D9}.card-title{font-size:19px;font-weight:700;fill:#F5FAFF}.card-body{font-size:14px;fill:#BDD0DE}.caption{font-size:12px;fill:#A8BFCE}.number{font-size:20px;font-weight:700;fill:#9AEEE0}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="758" rx="24" fill="url(#background)" stroke="#294153" stroke-width="2"/>
  <path d="M56 1H1144" stroke="url(#accent)" stroke-width="3"/>
  <text class="eyebrow" x="54" y="57">ВІД КОДУ ДО ПЕРЕВІРЕНОЇ ЗМІНИ</text>
  <text class="heading" x="54" y="116">Швидкі зміни. Чіткі межі.</text>
  <text class="body" x="54" y="158">Доведіть дозволену зміну застосунку до імпорту й перевірки виконання.</text>

  <path d="M82 222H1118" stroke="#365E69" stroke-width="2"/>
  <g fill="#112E3B" stroke="#65CCBF" stroke-width="2">
    <circle cx="82" cy="222" r="23"/><circle cx="306" cy="222" r="23"/><circle cx="530" cy="222" r="23"/><circle cx="754" cy="222" r="23"/><circle cx="978" cy="222" r="23"/>
  </g>
  <g class="number" text-anchor="middle"><text x="82" y="229">1</text><text x="306" y="229">2</text><text x="530" y="229">3</text><text x="754" y="229">4</text><text x="978" y="229">5</text></g>

  <rect x="54" y="266" width="202" height="198" rx="14" fill="#122D42" stroke="#355366"/>
  <rect x="278" y="266" width="202" height="198" rx="14" fill="#122D42" stroke="#355366"/>
  <rect x="502" y="266" width="202" height="198" rx="14" fill="#173741" stroke="#508B84"/>
  <rect x="726" y="266" width="202" height="198" rx="14" fill="#173741" stroke="#508B84"/>
  <rect x="950" y="266" width="196" height="198" rx="14" fill="#122D42" stroke="#355366"/>
  <path d="M262 365H272" stroke="#70CECD" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M486 365H496" stroke="#70CECD" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M710 365H720" stroke="#70CECD" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M934 365H944" stroke="#70CECD" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="card-title" x="74" y="305">Редагування</text>
  <text class="card-body" x="74" y="344">Огляньте застосунок.</text>
  <text class="card-body" x="74" y="371">Внесіть потрібні зміни.</text>
  <path d="M74 399H236" stroke="#345367"/>
  <text class="caption" x="74" y="435">APEXlang + міграції</text>

  <text class="card-title" x="298" y="305">Перевірка й план</text>
  <text class="card-body" x="298" y="344">Перевірте через SQLcl.</text>
  <text class="card-body" x="298" y="371">Перегляньте зміну.</text>
  <path d="M298 399H460" stroke="#345367"/>
  <text class="caption" x="298" y="435">Хеші коду й цілі</text>

  <text class="card-title" x="522" y="305">Захист</text>
  <text class="card-body" x="522" y="344">Звірте ціль і зміни.</text>
  <text class="card-body" x="522" y="371">Копія перед записом.</text>
  <path d="M522 399H684" stroke="#456C70"/>
  <text class="caption" x="522" y="435">Ідентичність і координація</text>

  <text class="card-title" x="746" y="305">Імпорт</text>
  <text class="card-body" x="746" y="344">Дотримуйтеся дозволу.</text>
  <text class="card-body" x="746" y="371">Код має бути незмінним.</text>
  <path d="M746 399H908" stroke="#456C70"/>
  <text class="caption" x="746" y="435">Стійкий журнал імпорту</text>

  <text class="card-title" x="970" y="305">Перевірка</text>
  <text class="card-body" x="970" y="344">Виконайте перевірки.</text>
  <text class="card-body" x="970" y="371">Огляньте поведінку.</text>
  <path d="M970 399H1126" stroke="#345367"/>
  <text class="caption" x="970" y="430">Вбудований браузер</text>
  <text class="caption" x="970" y="450">якщо доступний</text>

  <rect x="54" y="502" width="534" height="151" rx="14" fill="#102B3B" stroke="#355366"/>
  <path d="M80 530H102V551H80ZM85 525H97V530M86 540H96" stroke="#77DBCF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="546" font-size="21" font-weight="700" fill="#F5FAFF">Типово — локально</text>
  <text class="card-body" x="80" y="578">Стійка історія міграцій і координація однієї машини.</text>
  <text class="card-body" x="80" y="605">Координація через БД — явний необов’язковий режим.</text>
  <text class="caption" x="80" y="634">Звичайні plan і apply не потребують службових таблиць.</text>

  <rect x="612" y="502" width="534" height="151" rx="14" fill="#172B3A" stroke="#536274"/>
  <path d="M640 529L652 525L664 529V539C664 548 652 554 652 554C652 554 640 548 640 539ZM647 539L651 543L658 535" stroke="#A9C9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="680" y="546" font-size="21" font-weight="700" fill="#F5FAFF">Дозвіл прив’язаний до цілі</text>
  <text class="card-body" x="638" y="578">Dev/test імпорти — у межах визначеного користувачем застосунку.</text>
  <text class="card-body" x="638" y="605">Production потребує захищеного зовнішнього схвалення.</text>
  <text class="caption" x="638" y="634">Імпорт застосунку не дозволяє сторонніх записів даних.</text>

  <path d="M54 688H1146" stroke="#2E4659"/>
  <circle cx="62" cy="716" r="5" fill="#E8BF77"/>
  <text x="78" y="721" font-size="14" fill="#C6D5DF">Невідомий результат запису потребує звіряння. Не повторюйте імпорт наосліп.</text>
  <text x="1146" y="721" text-anchor="end" font-size="14" fill="#8FAABD">docs/deployment-safety.uk.md</text>
</svg>
